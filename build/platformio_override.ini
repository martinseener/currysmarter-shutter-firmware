; Currysmarter build: stock Tasmota tasmota32c3 + the Berry driver installer
; (build/xdrv_124_curry_installer.ino). Copied into the Tasmota tree by build.sh.
[platformio]
default_envs            = tasmota32c3-currysmarter

[env:tasmota32c3-currysmarter]
extends                 = env:tasmota32c3
build_flags             = ${env:tasmota32c3.build_flags}
                          -DUSE_CURRY_SHUTTER
                          -DCODE_IMAGE_STR='"currysmarter"'
                          ; keep the builder's home directory out of __FILE__ strings
                          -fmacro-prefix-map=${sysenv.HOME}/=/home/builder/
