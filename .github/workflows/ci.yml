name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: tests/run.sh

  build:
    # rebuilds the custom image from the official Tasmota tag, so anyone can
    # compare it with firmware/ (the build date makes the hash differ)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('build/build.sh') }}
      - run: build/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tasmota32c3-currysmarter
          path: firmware/tasmota32c3-currysmarter.bin
